<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Architecture Explorer - App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f7f1e8;
      --panel: #fffaf4;
      --text: #1c1917;
      --muted: #78716c;
      --accent: #c45c26;
      --accent-hover: #a34a1c;
      --ok: #3f6b4a;
      --warn: #b45309;
      --fail: #b91c1c;
      --border: rgba(28, 25, 23, 0.12);
      --border-strong: rgba(28, 25, 23, 0.2);
      --input: #f0e8dc;
      --shadow: 0 8px 28px rgba(28, 25, 23, 0.06);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Source Sans 3", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .shell { width: min(1120px, calc(100% - 2.5rem)); margin: 0 auto; }
    header {
      padding: 2.25rem 0 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    header a.home { color: var(--muted); text-decoration: none; font-size: 0.875rem; }
    header a.home:hover { color: var(--accent); }
    header h1 {
      margin: 0.5rem 0 0;
      font-family: "Fraunces", "Source Serif 4", Georgia, serif;
      font-size: 1.75rem;
      letter-spacing: -0.02em;
      font-weight: 600;
    }
    header p { margin: 0.5rem 0 0.85rem; color: var(--muted); font-size: 0.95rem; }
    header code {
      font-family: ui-monospace, monospace;
      font-size: 0.85rem;
      color: var(--accent);
    }
    #usage { font-size: 0.85rem; color: var(--muted); }
    main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      padding: 1.75rem 0 3rem;
    }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
    section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.35rem 1.4rem;
      box-shadow: var(--shadow);
    }
    h2 {
      margin: 0 0 1rem;
      font-family: "Fraunces", Georgia, serif;
      font-size: 1.05rem;
      color: var(--text);
      font-weight: 600;
      letter-spacing: -0.01em;
      text-transform: none;
    }
    button {
      background: var(--accent);
      color: #fffaf4;
      border: none;
      border-radius: 8px;
      padding: 0.55rem 1.05rem;
      font-weight: 600;
      font-size: 0.875rem;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    button:hover { background: var(--accent-hover); }
    button.secondary {
      background: transparent; color: var(--text); border: 1px solid var(--border-strong);
    }
    button.secondary:hover { border-color: var(--accent); color: var(--accent); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .row { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
    .stat { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.75rem; }
    ul.tree { list-style: none; padding: 0; margin: 0; max-height: 420px; overflow: auto; }
    ul.tree li {
      padding: 0.55rem 0.35rem;
      border-bottom: 1px solid var(--border);
      font-family: ui-monospace, monospace;
      font-size: 0.78rem;
    }
    ul.tree .imports { color: var(--muted); display: block; margin-top: 0.25rem; font-size: 0.72rem; }
    input[type="text"] {
      width: 100%;
      background: var(--input);
      border: 1px solid var(--border-strong);
      color: var(--text);
      border-radius: 8px;
      padding: 0.75rem 0.9rem;
      font: inherit;
      margin-bottom: 0.6rem;
    }
    input[type="text"]:focus { outline: none; border-color: var(--accent); }
    #answer {
      white-space: pre-wrap;
      font-size: 0.9rem;
      line-height: 1.6;
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      min-height: 140px;
      color: var(--muted);
    }
    #answer.ok { color: var(--ok); }
    #answer.warn { color: var(--warn); }
    #answer.err { color: var(--fail); }
    .cites { margin-top: 0.6rem; font-size: 0.8rem; color: var(--muted); }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <a class="home" href="/">← Landing</a>
      <h1>Architecture Explorer</h1>
      <p>Import graph from <code>sample-repo/</code> + grounded Q&amp;A with file citations.</p>
      <div id="usage">Token: demo</div>
    </header>
    <main>
      <section>
        <h2>Import graph</h2>
        <div class="row">
          <button id="btnIndex">Index sample-repo</button>
          <button class="secondary" id="btnRefresh">Refresh</button>
        </div>
        <div class="stat" id="stats">Not indexed yet.</div>
        <ul class="tree" id="tree"></ul>
      </section>
      <section>
        <h2>Ask (graph-grounded)</h2>
        <input type="text" id="question" value="Where does login authentication start?" />
        <div class="row">
          <button id="btnAsk">Ask</button>
        </div>
        <div id="answer">Answers cite file paths from the graph only.</div>
        <div class="cites" id="cites"></div>
      </section>
    </main>
  </div>
  <script>
    const TOKEN = localStorage.getItem("ae_token") || "demo";
    const authHeaders = () => ({
      "Content-Type": "application/json",
      Authorization: "Bearer " + TOKEN,
    });

    async function refreshUsage() {
      try {
        const res = await fetch("/usage", { headers: { Authorization: "Bearer " + TOKEN } });
        if (!res.ok) return;
        const u = await res.json();
        document.getElementById("usage").textContent =
          "Asks this month: " + u.asks_used + " · token " + TOKEN.slice(0, 8);
      } catch (_) {}
    }

    async function indexRepo() {
      const btn = document.getElementById("btnIndex");
      btn.disabled = true;
      document.getElementById("stats").textContent = "Indexing…";
      try {
        const res = await fetch("/index", {
          method: "POST",
          headers: authHeaders(),
          body: "{}",
        });
        const data = await res.json();
        document.getElementById("stats").textContent = res.ok
          ? `Indexed ${data.nodes} nodes / ${data.edges} edges at ${data.indexedAt}`
          : (data.error || "Index failed");
        await loadGraph();
      } catch {
        document.getElementById("stats").textContent = "Index failed: network error";
      } finally {
        btn.disabled = false;
      }
    }

    async function loadGraph() {
      try {
        const res = await fetch("/graph", { headers: { Authorization: "Bearer " + TOKEN } });
        if (!res.ok) {
          document.getElementById("tree").innerHTML = "<li class='warn'>No graph - click Index.</li>";
          return;
        }
        const g = await res.json();
        document.getElementById("stats").textContent =
          `${g.nodes.length} nodes / ${g.edges.length} edges · ${g.indexedAt}`;
        document.getElementById("tree").innerHTML = g.nodes.map(n => {
          const imports = n.imports.length
            ? `<span class="imports">→ ${n.imports.join(", ")}</span>`
            : `<span class="imports">(no local imports)</span>`;
          return `<li><strong>${n.path}</strong>${imports}</li>`;
        }).join("");
      } catch {
        document.getElementById("tree").innerHTML = "<li class='warn'>Could not load graph.</li>";
      }
    }

    async function ask() {
      const question = document.getElementById("question").value;
      const el = document.getElementById("answer");
      const btn = document.getElementById("btnAsk");
      btn.disabled = true;
      el.className = "";
      el.textContent = "Asking…";
      document.getElementById("cites").textContent = "";
      try {
        const res = await fetch("/ask", {
          method: "POST",
          headers: authHeaders(),
          body: JSON.stringify({ question }),
        });
        const data = await res.json();
        if (!res.ok) {
          el.className = "err";
          el.textContent = data.error || "Ask failed";
          return;
        }
        el.className = data.answered ? "ok" : "warn";
        el.textContent = data.answer;
        const provider = data.ai_provider ? ` · AI: ${data.ai_provider}` : "";
        document.getElementById("cites").textContent = data.citations?.length
          ? "Citations: " + data.citations.join(" · ") + provider
          : (provider ? provider.replace(/^ · /, "") : "");
        refreshUsage();
      } catch {
        el.className = "err";
        el.textContent = "Ask failed: network error";
      } finally {
        btn.disabled = false;
      }
    }

    document.getElementById("btnIndex").onclick = indexRepo;
    document.getElementById("btnRefresh").onclick = loadGraph;
    document.getElementById("btnAsk").onclick = ask;
    refreshUsage();
    loadGraph();
  </script>
</body>
</html>
